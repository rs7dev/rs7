<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>гигапоиск CSV</title>
   
<style>
        /* Базовые переменные для удобного переключения тем */
        :root {
            --bg-body: #f8fafc;
            --bg-container: #ffffff;
            --text-main: #334155;
            --text-title: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --bg-filebox: #f1f5f9;
            --border-filebox: #cbd5e1;
            --bg-th: #e2e8f0;
            --bg-hover-tr: #f8fafc;
            --bg-copy-btn: #ffffff;
            --input-bg: #ffffff;
            --input-disabled: #f8fafc;
            --accent-color: #3b82f6;
            --radius-main: 10px;
        }

        /* Цвета для Ночного режима */
        [data-theme="dark"], [data-theme="dark"] body {
            --bg-body: #0b0f19;
            --bg-container: #111827;
            --text-main: #cbd5e1;
            --text-title: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
            --bg-filebox: #1f2937;
            --border-filebox: #374151;
            --bg-th: #1f2937;
            --bg-hover-tr: #1f2937;
            --bg-copy-btn: #1f2937;
            --input-bg: #111827;
            --input-disabled: #0b0f19;
            --accent-color: #60a5fa;
        }

        [data-theme="dark"] .container {
            background: #1e293b !important;
            color: #f1f5f9 !important;
        }
        [data-theme="dark"] h2 {
            color: #f8fafc !important;
        }
        [data-theme="dark"] input, [data-theme="dark"] select {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border-color: #475569 !important;
        }
        [data-theme="dark"] input::placeholder {
            color: #94a3b8 !important; 
        }
        [data-theme="dark"] th {
            background-color: #334155 !important;
            color: #f8fafc !important;
            border: 1px solid #475569 !important;
        }
        [data-theme="dark"] td {
            color: #e2e8f0 !important;
            border: 1px solid #334155 !important;
        }
        [data-theme="dark"] tr:hover td {
            background-color: #334155 !important;
        }
        [data-theme="dark"] .search-grid {
            background-color: #0f172a !important;
            border-color: #334155 !important;
        }
        [data-theme="dark"] .search-field label {
            color: #cbd5e1 !important;
        }
        [data-theme="dark"] .file-box {
            background-color: #0f172a !important;
            border-color: #475569 !important;
            color: #cbd5e1 !important;
        }
        [data-theme="dark"] .copy-btn, [data-theme="dark"] .pagination-btn {
            background: #1e293b !important;
            border-color: #475569 !important;
            color: #ffffff !important;
        }
        [data-theme="dark"] .pagination-btn.active {
            background: #3b82f6 !important;
            border-color: #3b82f6 !important;
        }
        [data-theme="dark"] .counter {
            color: #94a3b8 !important;
        }

        /* Мягкая фосфорно-зеленая тема Матрицы */
        [data-theme="matrix"], [data-theme="matrix"] body {
            --bg-body: #1c3119;
            --bg-container: #0f1811;
            --text-main: #f1f5f9;
            --text-title: #ffffff;
            --text-muted: #a7bdae;
            --border-color: #1e3324;
            --bg-filebox: #1c3119;
            --border-filebox: #3d5945;
            --bg-th: #1f3624;
            --bg-hover-tr: #18291c;
            --bg-copy-btn: #142118;
            --input-bg: #0f1811;
            --input-disabled: #142118;
            --accent-color: #86efac;
        }

        [data-theme="matrix"] .global-search:focus {
            border-color: #527a5f !important;
            box-shadow: 0 0 0 3px rgba(134, 239, 172, 0.1) !important;
        }
        [data-theme="matrix"] .pagination-btn.active {
            background-color: #2d4a37 !important;
            border-color: #527a5f !important;
            color: #ffffff !important;
        }
        [data-theme="matrix"] .clear-btn:hover:not(:disabled) { 
            background-color: #451a1a !important;
            border-color: #991b1b !important; 
            color: #fca5a5 !important; 
        }

        /* Воздушная тема Аэро */
        [data-theme="aero"], [data-theme="aero"] body {
            --bg-body: #d2eaee;
            --bg-container: #e6f4f6;
            --text-main: #1e293b;
            --text-title: #0f172a;
            --text-muted: #577c82;
            --border-color: #a4cbd1;
            --bg-filebox: #d2eaee;
            --border-filebox: #a4cbd1;
            --bg-th: #bfe3e7;
            --bg-hover-tr: #dcf2f5;
            --bg-copy-btn: #daf0f2;
            --input-bg: #e6f4f6;
            --input-disabled: #daf0f2;
            --accent-color: #0891b2;
        }

        [data-theme="aero"] .global-search:focus {
            border-color: var(--accent-color) !important;
        }
        [data-theme="aero"] .pagination-btn.active {
            background-color: var(--accent-color) !important;
            border-color: var(--accent-color) !important;
        }
        /* ==========================================================================
           НОВЫЕ ПАЛИТРЫ (Светлые читаемые шапки + Насыщенный периметр + Тёмный Дом)
           ========================================================================== */

        /* 🏠 Тема: Уютный дом (Премиальная темная палитра «Ночной сити») */
        [data-theme="cozy-home"] { background-color: #0A1B24 !important; }
        [data-theme="cozy-home"] body { background-color: #0A1B24 !important; color: #DCE5E8 !important; }
        [data-theme="cozy-home"], [data-theme="cozy-home"] body {
            --bg-body: #0A1B24; --bg-container: #11232E; --text-main: #DCE5E8; --text-title: #FFFFFF;
            --text-muted: #84A4C4; --border-color: #1A3442; --bg-filebox: #1A2830; --border-filebox: #4F9097;
            --bg-th: #0A6067; --bg-hover-tr: #1C3647; --bg-copy-btn: #1A2830; --input-bg: #0A1B24;
            --input-disabled: #11232E; --accent-color: #C49C4C;
        }
        [data-theme="cozy-home"] .container { background: #11232E !important; color: #DCE5E8 !important; border-color: #1A3442 !important; }
        [data-theme="cozy-home"] input, [data-theme="cozy-home"] select, [data-theme="cozy-home"] .global-search { background-color: #0A1B24 !important; color: #FFFFFF !important; border-color: #4F9097 !important; }
        [data-theme="cozy-home"] .file-box { background-color: #1A2830 !important; border-color: #4F9097 !important; color: #DCE5E8 !important; }
        [data-theme="cozy-home"] .copy-btn, [data-theme="cozy-home"] .pagination-btn { background: #1A2830 !important; border-color: #1A3442 !important; color: #ffffff !important; }
        [data-theme="cozy-home"] th { background-color: #0A6067 !important; border-color: #1A3442 !important; }
        [data-theme="cozy-home"] td { border-color: #1A3442 !important; color: #DCE5E8 !important; }
        [data-theme="cozy-home"] tr:hover td { background-color: #1C3647 !important; }

        /* ☕ Тема: Чай с лимоном (Светлая таблица + Чайный периметр) */
        [data-theme="lemon-tea"] { background-color: #837306 !important; }
        [data-theme="lemon-tea"] body { background-color: #837306 !important; color: #1D0E12 !important; }
        [data-theme="lemon-tea"], [data-theme="lemon-tea"] body {
            --bg-body: #837306; --bg-container: #FAFAFA; --text-main: #1D0E12; --text-title: #FFFFFF;
            --text-muted: #FAF0D4; --border-color: #706203; --bg-filebox: #E6C455; --border-filebox: #706203;
            --bg-th: #F3D678; --bg-hover-tr: #F0E8BF; --bg-copy-btn: #EBEBEB; --input-bg: #FFFFFF;
            --input-disabled: #EBEBEB; --accent-color: #3C5A80;
        }
        [data-theme="lemon-tea"] .container { background: #FAFAFA !important; color: #1D0E12 !important; border-color: #706203 !important; }
        [data-theme="lemon-tea"] input, [data-theme="lemon-tea"] select, [data-theme="lemon-tea"] .global-search { background-color: #FFFFFF !important; color: #1D0E12 !important; border-color: #706203 !important; }
        [data-theme="lemon-tea"] th { background-color: #F3D678 !important; border-color: #706203 !important; }
        [data-theme="lemon-tea"] td { border-color: #706203 !important; color: #1D0E12 !important; }
        [data-theme="lemon-tea"] tr:hover td { background-color: #F0E8BF !important; }

        /* ⛰️ Тема: Горная саванна (Светлая таблица + Каменистый периметр) */
        [data-theme="savanna"] { background-color: #A47A58 !important; }
        [data-theme="savanna"] body { background-color: #A47A58 !important; color: #1A1810 !important; }
        [data-theme="savanna"], [data-theme="savanna"] body {
            --bg-body: #A47A58; --bg-container: #FDFDFD; --text-main: #1A1810; --text-title: #FFFFFF;
            --text-muted: #FAF0E4; --border-color: #8C9690; --bg-filebox: #E0AF79; --border-filebox: #735D4C;
            --bg-th: #F4C28A; --bg-hover-tr: #EBECE6; --bg-copy-btn: #E6EAE8; --input-bg: #FFFFFF;
            --input-disabled: #E6EAE8; --accent-color: #3D3814;
        }
        [data-theme="savanna"] .container { background: #FDFDFD !important; color: #1A1810 !important; border-color: #8C9690 !important; }
        [data-theme="savanna"] input, [data-theme="savanna"] select, [data-theme="savanna"] .global-search { background-color: #FFFFFF !important; color: #1A1810 !important; border-color: #8C9690 !important; }
        [data-theme="savanna"] th { background-color: #F4C28A !important; border-color: #8C9690 !important; }
        [data-theme="savanna"] td { border-color: #8C9690 !important; color: #1A1810 !important; }
        [data-theme="savanna"] tr:hover td { background-color: #EBECE6 !important; }

        /* 🌿 Тема: Шалфей и хвоя (Светлая таблица + Оливковый периметр) */
        [data-theme="sage"] { background-color: #4C542C !important; }
        [data-theme="sage"] body { background-color: #4C542C !important; color: #0B1006 !important; }
        [data-theme="sage"], [data-theme="sage"] body {
            --bg-body: #4C542C; --bg-container: #FAFAF8; --text-main: #0B1006; --text-title: #FFFFFF;
            --text-muted: #E4ECD8; --border-color: #7D8577; --bg-filebox: #A4BD8A; --border-filebox: #7D8577;
            --bg-th: #BED4A4; --bg-hover-tr: #E2E6DC; --bg-copy-btn: #EAEAE6; --input-bg: #FFFFFF;
            --input-disabled: #E2E6DC; --accent-color: #557833;
        }
        [data-theme="sage"] .container { background: #FAFAF8 !important; color: #0B1006 !important; border-color: #7D8577 !important; }
        [data-theme="sage"] input, [data-theme="sage"] select, [data-theme="sage"] .global-search { background-color: #FFFFFF !important; color: #0B1006 !important; border-color: #7D8577 !important; }
        [data-theme="sage"] th { background-color: #BED4A4 !important; border-color: #7D8577 !important; }
        [data-theme="sage"] td { border-color: #7D8577 !important; color: #0B1006 !important; }
        [data-theme="sage"] tr:hover td { background-color: #E2E6DC !important; }

        /* ❄️ Тема: Заснеженный лес (Светлая таблица + Сине-зеленый периметр) */
        [data-theme="snow-forest"] { background-color: #2B5C6C !important; }
        [data-theme="snow-forest"] body { background-color: #2B5C6C !important; color: #0D161A; }
        [data-theme="snow-forest"], [data-theme="snow-forest"] body {
            --bg-body: #2B5C6C; --bg-container: #F5F8FA; --text-main: #0D161A; --text-title: #FFFFFF;
            --text-muted: #DEE7ED; --border-color: #5C91A2; --bg-filebox: #8EACCC; --border-filebox: #5C91A2;
            --bg-th: #A1BCD4; --bg-hover-tr: #DEE6EB; --bg-copy-btn: #E4ECF2; --input-bg: #FFFFFF;
            --input-disabled: #DEE6EB; --accent-color: #358EA1;
        }
        [data-theme="snow-forest"] .container { background: #F5F8FA !important; color: #0D161A !important; border-color: #5C91A2 !important; }
        [data-theme="snow-forest"] input, [data-theme="snow-forest"] select, [data-theme="snow-forest"] .global-search { background-color: #FFFFFF !important; color: #0D161A !important; border-color: #5C91A2 !important; }
        [data-theme="snow-forest"] th { background-color: #A1BCD4 !important; border-color: #5C91A2 !important; }
        [data-theme="snow-forest"] td { border-color: #5C91A2 !important; color: #0D161A !important; }
        [data-theme="snow-forest"] tr:hover td { background-color: #DEE6EB !important; }

        /* 🌊 Тема: Глубокий океан (Светлая таблица + Плотный синий периметр) */
        [data-theme="ocean"] { background-color: #04547E !important; }
        [data-theme="ocean"] body { background-color: #04547E !important; color: #07121A !important; }
        [data-theme="ocean"], [data-theme="ocean"] body {
            --bg-body: #04547E; --bg-container: #F0F4F7; --text-main: #07121A; --text-title: #FFFFFF;
            --text-muted: #D4E3ED; --border-color: #5C8CA9; --bg-filebox: #7AA6C2; --border-filebox: #5C8CA9;
            --bg-th: #90B9D3; --bg-hover-tr: #D6E2EB; --bg-copy-btn: #DAE4EC; --input-bg: #FFFFFF;
            --input-disabled: #D6E2EB; --accent-color: #04709E;
        }
        [data-theme="ocean"] .container { background: #F0F4F7 !important; color: #07121A !important; border-color: #5C8CA9 !important; }
        [data-theme="ocean"] input, [data-theme="ocean"] select, [data-theme="ocean"] .global-search { background-color: #FFFFFF !important; color: #07121A !important; border-color: #5C8CA9 !important; }
        [data-theme="ocean"] th { background-color: #90B9D3 !important; border-color: #5C8CA9 !important; }
        [data-theme="ocean"] td { border-color: #5C8CA9 !important; color: #07121A !important; }
        [data-theme="ocean"] tr:hover td { background-color: #D6E2EB !important; }

        /* --- Настройка контрастных цветов для текста в шапках таблиц --- */
        [data-theme="lemon-tea"] th { color: #837306 !important; font-weight: bold; }
        [data-theme="savanna"] th { color: #A47A58 !important; font-weight: bold; }
        [data-theme="sage"] th { color: #4C542C !important; font-weight: bold; }
        [data-theme="snow-forest"] th { color: #2B5C6C !important; font-weight: bold; }
        [data-theme="ocean"] th { color: #04547E !important; font-weight: bold; }
        [data-theme="cozy-home"] th { color: var(--accent-color) !important; font-weight: bold; }
        /* ==========================================================================
           4. ОРИГИНАЛЬНЫЕ ФУНКЦИОНАЛЬНЫЕ СТИЛИ (Часть 1)
           ========================================================================= */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 15px; background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.2s ease, color 0.2s ease; -webkit-font-smoothing: antialiased; }
        
        .container { 
            max-width: 100% !important; 
            margin: 0; 
            background: var(--bg-container); 
            padding: 20px 25px 25px 25px; 
            border-radius: 12px; 
            position: relative; 
            box-sizing: border-box; 
            border: 1px solid var(--border-color); 
        }

        .header-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 20px; 
            margin-bottom: 25px; 
            flex-wrap: nowrap; 
        }

        .theme-toggle-btn { position: static !important; padding: 10px 14px; font-size: 18px; background: var(--bg-copy-btn); border: 1px solid var(--border-filebox); border-radius: 8px; cursor: pointer; }
        
        h2 { margin: 0 !important; padding: 0 !important; white-space: nowrap; color: var(--text-title); }
        
        .file-box { border: 2px dashed var(--border-filebox); padding: 10px 20px !important; text-align: center; border-radius: 8px; background-color: var(--bg-filebox); margin-bottom: 0 !important; cursor: pointer; position: relative; flex: 1; max-width: 500px; }
        .file-box input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .search-bar-wrapper { display: flex; gap: 10px; margin-bottom: 20px; }
        .global-search { flex: 1; padding: 12px 18px; border: 1px solid var(--border-filebox); border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; background-color: var(--input-bg); color: var(--text-main); transition: border-color 0.15s ease; } .global-search:focus { border-color: var(--accent-color); }
        .global-search:focus { box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .global-search:disabled { background-color: var(--input-disabled); border-color: var(--border-filebox); cursor: not-allowed; }
        
        .clear-btn { 
            padding: 0 22px; 
            font-size: 14px; 
            font-weight: 600; 
            background-color: var(--bg-filebox); 
            color: var(--text-main); 
            border: 1px solid var(--border-filebox); 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; 
            white-space: nowrap; 
        }

        .clear-btn:hover:not(:disabled) { 
            background-color: #fee2e2; 
            border-color: #f87171;     
            color: #ef4444;            
        }

        [data-theme="dark"] .clear-btn:hover:not(:disabled),
        [data-theme="matrix"] .clear-btn:hover:not(:disabled) { 
            background-color: #7f1d1d; 
            border-color: #b91c1c; 
            color: #fca5a5;            
        }

        .clear-btn:disabled { 
            background-color: var(--input-disabled); 
            cursor: not-allowed; 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            opacity: 0.6;
        }

        .search-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
             gap: 15px; margin-bottom: 5px; padding: 15px; background: var(--bg-filebox); border: 1px solid var(--border-color); border-radius: 8px; }
        .search-field { display: flex; flex-direction: column; }
        .search-field label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-field input { padding: 10px; border: 1px solid var(--border-filebox); border-radius: 6px; font-size: 14px; outline: none; background-color: var(--input-bg); color: var(--text-main); }
        
        .table-wrapper { 
            overflow-x: auto; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            max-height: calc(100vh - 280px) !important; 
            min-height: 200px; 
            margin-right: 0; 
            padding-right: 5px; 
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }
        th { 
            background-color: var(--bg-th) !important; 
            padding: 10px 20px; 
            font-weight: 600; 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            border-bottom: 2px solid var(--border-color); 
            position: sticky; 
            top: 0; 
            z-index: 5; 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        td { 
            padding: 12px 24px; 
            padding-right: 55px; 
            border: 1px solid var(--border-color); 
            position: relative; 
            line-height: 1.4; 
        }
        /* ==========================================================================
           4. ОРИГИНАЛЬНЫЕ ФУНКЦИОНАЛЬНЫЕ СТИЛИ (Часть 2 + Конец)
           ========================================================================= */
        .copy-btn { 
            position: absolute; 
            right: 8px; 
            top: 50%; 
            transform: translateY(-50%); 
            opacity: 0; 
            background: var(--bg-copy-btn); 
            border: 1px solid var(--border-filebox); 
            border-radius: 6px; 
            cursor: pointer; 
            padding: 6px 8px; 
            font-size: 12px; 
            color: var(--text-main); 
            transition: opacity 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        td:hover .copy-btn { 
            opacity: 1; 
        }

        .copy-btn:hover { 
            border-color: var(--accent-color); 
            background-color: var(--bg-filebox); 
        }

        .copy-btn.copied { 
            background-color: #dcfce7 !important; 
            border-color: #22c55e !important; 
            color: #16a34a !important; 
        }
        
        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .counter { font-size: 14px; color: var(--text-muted); font-weight: bold; }
        .page-size-selector { font-size: 14px; color: var(--text-muted); }
        .page-size-selector select { padding: 5px; border-radius: 6px; border: 1px solid var(--border-filebox); outline: none; background: var(--input-bg); color: var(--text-main); margin-left: 5px; cursor: pointer; }

        .pagination-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 6px; 
            margin-top: auto; 
            padding-top: 20px;
            flex-wrap: wrap; 
        }

        .pagination-btn { 
            padding: 8px 14px; 
            font-size: 13px; 
            font-weight: 600; 
            background: var(--bg-copy-btn); 
            border: 1px solid var(--border-filebox); 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; 
            color: var(--text-main); 
        }

        .pagination-btn:hover:not(:disabled) { 
            border-color: var(--accent-color); 
            color: var(--accent-color); 
            background-color: var(--bg-filebox); 
        }

<!-- 2. Панель чекбоксов (Теперь она встает строго НИЖЕ шестерёнки, но ВЫШЕ самой таблицы) -->

    <div class="table-wrapper">
        <table id="dataTable"> <thead id="tableHead"></thead> <tbody id="tableBody"></tbody> </table> </div>

   

<script>

// --- НАЧАЛО ПРАВКИ: Подключение IndexedDB для долгосрочного хранения таблиц ---
var db = null;
var request = indexedDB.open("GigaSearchDB", 1);

request.onupgradeneeded = function(e) {
    var database = e.target.result;
    if (!database.objectStoreNames.contains("saved_tabs")) {
        database.createObjectStore("saved_tabs", { keyPath: "id" });
    }
};

request.onsuccess = function(e) {
    db = e.target.result;
    // База данных успешно подключена, пробуем восстановить вкладки из памяти ПК
    restoreTabsFromDB();
};

request.onerror = function(e) {
    console.error("Ошибка IndexedDB:", e.target.error);
};

// Функция записи вкладки в базу данных ПК
function saveTabToDB(tab) {
    if (!db) return;
    var tx = db.transaction("saved_tabs", "readwrite");
    var store = tx.objectStore("saved_tabs");
    store.put(tab);
}

// Функция удаления вкладки из базы данных ПК
function deleteTabFromDB(tabId) {
    if (!db) return;
    var tx = db.transaction("saved_tabs", "readwrite");
    var store = tx.objectStore("saved_tabs");
    store.delete(tabId);
}

// Функция автовосстановления вкладок при открытии браузера
function restoreTabsFromDB() {
    if (!db) return;
    var tx = db.transaction("saved_tabs", "readonly");
    var store = tx.objectStore("saved_tabs");
    var requestAll = store.getAll();
    
    requestAll.onsuccess = function(e) {
        var savedTabs = e.target.result;
        if (savedTabs && savedTabs.length > 0) {
            tabs = savedTabs;
            // Активируем самую последнюю открытую вкладку
            activateTab(tabs[tabs.length - 1].id);
        }
    };
}
// --- КОНЕЦ ПРАВКИ ---


// 1. Центральное хранилище вкладок и настройки активного экрана
var tabs = []; 
var activeTabId = null;
var searchTimeout = null; // Дебаунсинг-таймер для клавиатуры

// Временные кэш-переменные для парсинга файлов на Этапе А (чекбоксы)
var rawCSVLines = []; 
var rawDelimiter = ';';

// 2. Извлекаем тему оформления из памяти браузера при старте страницы
var savedTheme = localStorage.getItem('saved_table_theme') || 'light';
var themeToggleBtn = document.getElementById('themeToggleBtn');

function applyTheme(t) {
    if (t === 'light') { 
        document.documentElement.removeAttribute('data-theme'); 
        themeToggleBtn.textContent = '☀️'; 
    } else { 
        document.documentElement.setAttribute('data-theme', t); 
        if (t === 'dark') themeToggleBtn.textContent = '🌙'; 
        if (t === 'matrix') themeToggleBtn.textContent = '🌲'; 
        if (t === 'aero') themeToggleBtn.textContent = '🧊'; 
        if (t === 'cozy-home') themeToggleBtn.textContent = '🏠'; 
        if (t === 'lemon-tea') themeToggleBtn.textContent = '☕'; 
        if (t === 'savanna') themeToggleBtn.textContent = '⛰️'; 
        if (t === 'sage') themeToggleBtn.textContent = '🌿'; 
        if (t === 'snow-forest') themeToggleBtn.textContent = '❄️'; 
        if (t === 'ocean') themeToggleBtn.textContent = '🌊'; 
    }
}

// --- НАЧАЛО ПРАВКИ: Возвращаем логику кнопке переключения тем ---
if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = 'light';
        
        // Циклический перебор всех ваших 10 роскошных тем оформления
        if (current === 'light') next = 'dark';
        else if (current === 'dark') next = 'matrix';
        else if (current === 'matrix') next = 'aero';
        else if (current === 'aero') next = 'cozy-home';
        else if (current === 'cozy-home') next = 'lemon-tea';
        else if (current === 'lemon-tea') next = 'savanna';
        else if (current === 'savanna') next = 'sage';
        else if (current === 'sage') next = 'snow-forest';
        else if (current === 'snow-forest') next = 'ocean';
        else if (current === 'ocean') next = 'light';
        
        applyTheme(next);
        localStorage.setItem('saved_table_theme', next);
    });
}
// --- КОНЕЦ ПРАВКИ ---

// --- НАЧАЛО ПРАВКИ: Возвращаем меню выбора темы при зажатии/правом клике ---
// --- НАЧАЛО ПРАВКИ: Исправленное меню тем с защитой от ухода за экран и работающим зажатием ---
// --- НАЧАЛО ПРАВКИ: Контекстное меню тем с привязкой правого верхнего угла к точке нажатия ---
var themeMenu = document.getElementById('themeContextMenu');
var touchTimeout = null;

if (themeToggleBtn && themeMenu) {
    // 1. Показ меню по правому клику мыши (обычный ПК)
    themeToggleBtn.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showThemeMenu(e.clientX, e.clientY);
    });

    // 2. Показ меню по долгому зажатию пальца (мобильные)
    themeToggleBtn.addEventListener('touchstart', function(e) {
        if (e.touches.length === 0) return;
        var touch = e.touches[0];
        var posX = touch.clientX;
        var posY = touch.clientY;
        
        clearTimeout(touchTimeout);
        touchTimeout = setTimeout(function() {
            showThemeMenu(posX, posY);
        }, 500); 
    });

    themeToggleBtn.addEventListener('touchend', function() {
        clearTimeout(touchTimeout);
    });
    
    themeToggleBtn.addEventListener('touchmove', function() {
        clearTimeout(touchTimeout);
    });

    // Функция позиционирования: правый верхний угол меню крепится к точке клика/касания
    function showThemeMenu(x, y) {
        themeMenu.style.display = 'block';
        
        var windowWidth = window.innerWidth;
        // Считаем отступ справа: вся ширина экрана минус координата X нажатия
        var offsetRight = windowWidth - x;
        
        // Сбрасываем старый стиль left и жестко крепим через right
        themeMenu.style.left = 'auto';
        themeMenu.style.right = offsetRight + 'px';
        themeMenu.style.top = (y + 10) + 'px';
    }

    // Клик по пункту меню переключает тему
    document.querySelectorAll('.context-menu-item').forEach(function(item) {
        item.addEventListener('click', function() {
            var selectedTheme = this.getAttribute('data-theme');
            applyTheme(selectedTheme);
            localStorage.setItem('saved_table_theme', selectedTheme);
            themeMenu.style.display = 'none';
        });
        item.addEventListener('mouseenter', function() { this.style.background = 'var(--bg-filebox)'; });
        item.addEventListener('mouseleave', function() { this.style.background = 'transparent'; });
    });

    // Скрываем меню при клике мимо
    document.addEventListener('click', function(e) {
        if (!themeToggleBtn.contains(e.target) && !themeMenu.contains(e.target)) {
            themeMenu.style.display = 'none';
        }
    });
}
// --- КОНЕЦ ПРАВКИ ---




applyTheme(savedTheme);

// 3. Восстанавливаем лимит столбцов из памяти ПК
var savedLimit = localStorage.getItem('saved_column_limit') || '4';
var limitInput = document.getElementById('columnLimitInput');
if (limitInput) limitInput.value = savedLimit;

document.getElementById('columnLimitInput').addEventListener('input', function() {
    localStorage.setItem('saved_column_limit', this.value);
});

// Перехватываем стандартное событие изменения инпута файлов
document.getElementById('csvFile').addEventListener('change', function(e) {
    var files = e.target.files; if (!files || files.length === 0) return;
    handleNewFileSelection(files[0]);
});

// Кнопка "+ Новый файл" имитирует клик по скрытому инпуту выбора файла
document.getElementById('addTabBtn').addEventListener('click', function() {
    document.getElementById('csvFile').click();
});

function handleNewFileSelection(file) {
    var name = file.name;
    // document.getElementById('fileStatus').innerHTML = "Обработка файла: <strong>" + name + "</strong>";
    
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
        alert("Формат Excel (.xlsx) временно недоступен без локального сервера.\nПожалуйста, сохраните таблицу в Excel как 'CSV (разделитель - запятая)'.");
        document.getElementById('fileStatus').innerHTML = "<span style='color:#ef4444;'>Выберите файл .csv</span>";
        return;
    }
    
    var reader = new FileReader();
    reader.onload = function(evt) {
        var text = evt.target.result;
        if (text.indexOf(String.fromCharCode(65533)) !== -1) {
            var ur = new FileReader(); ur.onload = function(eUtf) { 
                processCSVData(eUtf.target.result, name); 
            }; ur.readAsText(file, 'utf-8');
        } else { 
            processCSVData(text, name); 
        }
    };
    reader.readAsText(file, 'windows-1251');
}

function processCSVData(text, fileName) {
    var wrapper = document.querySelector('.table-wrapper');
    if (wrapper) wrapper.style.display = 'none';
    
    var cleanText = text.replace(/\r/g, "");
    var lines = cleanText.split("\n").filter(function(l) { return l.trim() !== ""; }); 
    if (lines.length === 0) return;
    
    var firstLine = lines.shift();
    var delimiter = firstLine.includes('\t') ? '\t' : (!firstLine.includes(';') && firstLine.includes(',') ? ',' : ';');
    
    function parseCSVLine(line, delim) {
        var res = [], cur = '', q = false;
        for (var i = 0; i < line.length; i++) {
            var c = line.charAt(i); if (c === '"') { q = !q; } else if (c === delim && !q) { res.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; } else { cur += c; }
        }
        res.push(cur.trim().replace(/^"|"$/g, '')); return res;
    }
    
    rawCSVLines = lines;
    rawDelimiter = delimiter;
    
    var allHeaders = parseCSVLine(firstLine, delimiter);
    var limit = parseInt(document.getElementById('columnLimitInput').value) || 4;
    
    document.getElementById('columnChooserPanel').style.display = 'none';
    var grid = document.getElementById('checkboxesGrid'); grid.innerHTML = '';
    
    var oldMaster = document.getElementById('masterCheckboxWrapper');
    if (oldMaster) oldMaster.remove();
    
    var masterWrapper = document.createElement('div');
    masterWrapper.id = 'masterCheckboxWrapper';
    masterWrapper.style.cssText = 'border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;';
    
    var masterLabel = document.createElement('label');
    masterLabel.className = 'column-checkbox-label';
    masterLabel.style.cssText = 'display: flex; align-items: center; font-weight: 700; cursor: pointer;';

    var masterChk = document.createElement('input');
    masterChk.type = 'checkbox'; masterChk.id = 'masterColumnsSelector';
    masterChk.checked = (allHeaders.length <= limit); 

    masterChk.addEventListener('change', function() {
        var isChecked = this.checked;
        document.querySelectorAll('#checkboxesGrid input[type="checkbox"]').forEach(function(chk) { chk.checked = isChecked; });
    });

    masterLabel.appendChild(masterChk); masterLabel.appendChild(document.createTextNode(' Выбрать все колонки файла'));
    masterWrapper.appendChild(masterLabel); grid.parentNode.insertBefore(masterWrapper, grid);
    
    allHeaders.forEach(function(headerName, idx) {
        var label = document.createElement('label'); label.className = 'column-checkbox-label';
        var chk = document.createElement('input'); chk.type = 'checkbox'; chk.setAttribute('data-raw-index', idx);
        chk.setAttribute('data-header-name', headerName || ("Колонка " + (idx + 1)));
        if (idx < limit || allHeaders.length <= limit) chk.checked = true; 
        label.appendChild(chk); label.appendChild(document.createTextNode(headerName || ("Колонка " + (idx + 1))));
        grid.appendChild(label);
    });
    
    document.getElementById('applyColumnsBtn').setAttribute('data-pending-filename', fileName);

    if (allHeaders.length > limit) {
        var limitBox = document.getElementById('limitBox');
        if (limitBox) { limitBox.style.backgroundColor = '#fee2e2'; limitBox.style.borderColor = '#f87171'; limitBox.style.color = '#ef4444'; }
        document.getElementById('columnChooserPanel').style.display = 'block';
        return; 
    }
    
    createNewTab(fileName, allHeaders, lines, delimiter, null);
}

// Сборка по нажатию синей кнопки "Применить выбор" с защитой от дублирования вкладок
document.getElementById('applyColumnsBtn').addEventListener('click', function() {
    var startTime = performance.now();
    var fileName = this.getAttribute('data-pending-filename'); // Читаем имя, если файл только что выбран

    var limitBox = document.getElementById('limitBox');
    if (limitBox) { limitBox.style.backgroundColor = ''; limitBox.style.borderColor = ''; limitBox.style.color = ''; }

    var chosenIndices = [], chosenHeaders = [];
    document.querySelectorAll('#checkboxesGrid input[type="checkbox"]').forEach(function(chk) {
        if (chk.checked) { 
            chosenIndices.push(parseInt(chk.getAttribute('data-raw-index'))); 
            chosenHeaders.push(chk.getAttribute('data-header-name')); 
        }
    });
    if (chosenIndices.length === 0) { alert("Выберите хотя бы один столбец!"); return; }
    
    document.getElementById('columnChooserPanel').style.display = 'none';
    
    // --- ИСПРАВЛЕНИЕ ЛОГИКИ: Проверяем, это новый файл или пересборка текущего ---
    if (fileName) {
        // Сценарий А: Файл только что загружен, создаём для него честную новую вкладку
        createNewTab(fileName, chosenHeaders, rawCSVLines, rawDelimiter, chosenIndices);
        // Очищаем временную метку, чтобы при следующем открытии шестерёнки сработал Сценарий Б
        this.removeAttribute('data-pending-filename');
    } else {
        // Сценарий Б: Мы зашли через шестерёнку существующей вкладки. Пересобираем строго её!
        var currentTab = getActiveTab();
        if (currentTab) {
            var cleanRows = [];
            rawCSVLines.forEach(function(line) {
                var res = line.split(rawDelimiter);
                var cells = chosenIndices.map(function(idx) { return res[idx] !== undefined ? res[idx] : ""; });
                if (cells.length > 0 && cells.some(function(c) { return c !== ""; })) cleanRows.push(cells);
            });
            
            // Перезаписываем данные внутри активного пакета вкладки
            currentTab.tableHeaders = chosenHeaders;
            currentTab.globalRows = cleanRows;
            currentTab.currentFilteredRows = cleanRows.concat();
            currentTab.currentPage = 1;
            saveTabToDB(currentTab); // <-- ДОБАВИТЬ ЭТУ СТРОК
            
            // Перерисовываем поиски и таблицу на основе новых колонок
            generateSearchFields(); 
            renderTableStructure(); 
            renderTableData();
        }
    }
    
    var duration = (performance.now() - startTime).toFixed(1);
    var currentTab = getActiveTab();
    if (currentTab) {
        document.getElementById('counter').innerHTML = 
            " <strong>" + currentTab.currentFilteredRows.length + "</strong> |  <strong>" + duration + " мс</strong>";
    }
});


function createNewTab(fileName, headers, lines, delimiter, chosenIndices) {
    var tabId = "tab_" + Date.now();
    var cleanRows = [];
    
    lines.forEach(function(line) {
        var res = line.split(delimiter);
        var cells = [];
        if (chosenIndices) {
            cells = chosenIndices.map(function(idx) { return res[idx] !== undefined ? res[idx] : ""; });
        } else {
            cells = res;
        }
        if (cells.length > 0 && cells.some(function(c) { return c !== ""; })) cleanRows.push(cells);
    });
    
    var newTab = {
        id: tabId, name: fileName, tableHeaders: headers, globalRows: cleanRows, currentFilteredRows: cleanRows.concat(),
        currentPage: 1, pageSize: 50, globalSearchQuery: "", columnFilters: []
    };
    
    tabs.push(newTab);
    saveTabToDB(newTab); // <-- ДОБАВИТЬ ЭТУ СТРОКУ
    activateTab(tabId);
}

function getActiveTab() {
    return tabs.find(function(t) { return t.id === activeTabId; }) || null;
}

function activateTab(tabId) {
    activeTabId = tabId; var currentTab = getActiveTab(); if (!currentTab) return;
    
    document.getElementById('globalSearchInput').value = currentTab.globalSearchQuery;
    document.getElementById('pageSizeSelect').value = currentTab.pageSize === currentTab.globalRows.length ? 'all' : currentTab.pageSize;
    
    document.getElementById('toggleFiltersBtn').disabled = false;
    document.getElementById('clearFiltersBtn').disabled = false;
    document.getElementById('toggleColumnsBtn').disabled = false;
    document.getElementById('globalSearchInput').disabled = false;
    
    if (document.getElementById('pageSizeWrapper')) document.getElementById('pageSizeWrapper').style.display = 'block';
    if (document.querySelector('.table-wrapper')) document.querySelector('.table-wrapper').style.display = 'block';
    
    renderTabsUI(); generateSearchFields(); renderTableStructure(); renderTableData();
}

function closeTab(tabId, e) {
    if (e) e.stopPropagation();
    var index = tabs.findIndex(function(t) { return t.id === tabId; }); if (index === -1) return;
    
    tabs.splice(index, 1);
    deleteTabFromDB(tabId); // <-- ДОБАВИТЬ ЭТУ СТРОКУ

    if (tabs.length === 0) {
        activeTabId = null;
        document.getElementById('tabsContainer').innerHTML = ''; document.getElementById('tableHead').innerHTML = '';
        document.getElementById('tableBody').innerHTML = ''; document.getElementById('counter').textContent = '';
        document.getElementById('pagination').innerHTML = ''; document.getElementById('searchContainer').innerHTML = '';
        
        document.getElementById('toggleFiltersBtn').disabled = true; document.getElementById('clearFiltersBtn').disabled = true;
        document.getElementById('toggleColumnsBtn').disabled = true; document.getElementById('globalSearchInput').disabled = true;
        document.getElementById('globalSearchInput').value = ''; document.getElementById('pageSizeWrapper').style.display = 'none';
        document.querySelector('.table-wrapper').style.display = 'none';
        // document.getElementById('fileStatus').innerHTML = "Все вкладки закрыты. Выберите файл для начала работы.";
    } else if (activeTabId === tabId) {
        var nextActiveIndex = index > 0 ? index - 1 : 0; activateTab(tabs[nextActiveIndex].id);
    } else {
        renderTabsUI();
    }
}

function renderTabsUI() {
    var container = document.getElementById('tabsContainer'); container.innerHTML = '';
    tabs.forEach(function(tab) {
        var btn = document.createElement('button'); btn.className = 'toggle-filters-btn';
        if (tab.id === activeTabId) btn.classList.add('active-tab');
        btn.style.cssText = 'padding: 6px 12px; font-size: 13px; font-weight: bold; position: relative; padding-right: 28px; cursor: pointer;';
        btn.textContent = tab.name;
        btn.addEventListener('click', function() { activateTab(tab.id); });
        
        var cross = document.createElement('span'); cross.textContent = '×';
        cross.style.cssText = 'position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-weight: bold; color: var(--text-muted); cursor: pointer; font-size: 14px;';
        cross.addEventListener('click', function(e) { closeTab(tab.id, e); });
        
        btn.appendChild(cross); container.appendChild(btn);
    });
    var activeTab = getActiveTab();
    // if (activeTab) document.getElementById('fileStatus').innerHTML = "Активный файл: <strong>" + activeTab.name + "</strong>";
}

function generateSearchFields() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    var container = document.getElementById('searchContainer'); container.innerHTML = ''; container.style.display = 'none';
    
    currentTab.tableHeaders.forEach(function(h, idx) {
        var d = document.createElement('div'); d.className = 'search-field';
        var l = document.createElement('label'); l.textContent = h || ("Колонка " + (idx + 1));
        var input = document.createElement('input'); input.type = 'text'; input.placeholder = 'Фильтр...'; input.setAttribute('data-index', idx);
        input.value = currentTab.columnFilters[idx] || "";
        
        input.addEventListener('input', function() {
            clearTimeout(searchTimeout); searchTimeout = setTimeout(function() { runCombinedSearch(); }, 350);
        });
        d.appendChild(l); d.appendChild(input); container.appendChild(d);
    });
}

document.getElementById('globalSearchInput').addEventListener('input', function() {
    clearTimeout(searchTimeout); searchTimeout = setTimeout(function() { runCombinedSearch(); }, 350); 
});

document.getElementById('clearFiltersBtn').addEventListener('click', function() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    document.getElementById('globalSearchInput').value = ""; 
    document.querySelectorAll('#searchContainer input').forEach(function(input) { input.value = ""; });
    currentTab.globalSearchQuery = ""; currentTab.columnFilters = []; currentTab.currentPage = 1; 
    currentTab.currentFilteredRows = currentTab.globalRows.concat(); 
    renderTableStructure(); renderTableData();
});

document.getElementById('pageSizeSelect').addEventListener('change', function() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    currentTab.pageSize = this.value === 'all' ? currentTab.globalRows.length : parseInt(this.value); 
    currentTab.currentPage = 1; renderTableData();
});

function runCombinedSearch() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    var gQ = document.getElementById('globalSearchInput').value.toLowerCase().trim();
    currentTab.globalSearchQuery = document.getElementById('globalSearchInput').value;
    
    var activeFilters = [];
    document.querySelectorAll('#searchContainer input').forEach(function(input) {
        var idx = parseInt(input.getAttribute('data-index'));
        var val = input.value.toLowerCase().trim(); currentTab.columnFilters[idx] = input.value;
        if (val) activeFilters.push({ idx: idx, q: val });
    });

    currentTab.currentFilteredRows = currentTab.globalRows.filter(function(cells) {
        var mG = true;
        if (gQ) {
            var searchWords = gQ.split('%').map(function(w) { return w.trim(); }).filter(function(w) { return w !== ""; });
            mG = searchWords.every(function(word) {
                return cells.some(function(c) { return String(c || '').toLowerCase().includes(word); });
            });
        }
        var mC = activeFilters.every(function(f) {
            var cV = ''; cells.forEach(function(c, i) { if (i === f.idx) cV = String(c).toLowerCase(); }); return cV.includes(f.q);
        });
        return mG && mC;
    });
    currentTab.currentPage = 1; renderTableData();
}

function renderTableStructure() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    var th = document.getElementById('tableHead'); th.innerHTML = ''; if (currentTab.tableHeaders.length === 0) return;
    var row = document.createElement('tr'); var dragSrcIndex = null; 

    currentTab.tableHeaders.forEach(function(h, idx) { 
        var t = document.createElement('th'); var titleSpan = document.createElement('span'); titleSpan.textContent = h || ("Колонка " + (idx + 1)); t.appendChild(titleSpan);
        var closeBtn = document.createElement('span'); closeBtn.textContent = ' ×'; closeBtn.style.cssText = 'cursor:pointer; margin-left:8px; color:var(--text-muted); font-weight:bold;';
        
        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation(); var currentHeaderName = currentTab.tableHeaders[idx];
            var relatedCheckbox = document.querySelector('#checkboxesGrid input[type="checkbox"][data-header-name="' + currentHeaderName + '"]');
            if (relatedCheckbox) relatedCheckbox.checked = false;

            currentTab.tableHeaders.splice(idx, 1);
            currentTab.globalRows = currentTab.globalRows.map(function(cells) { var n = cells.concat(); n.splice(idx, 1); return n; });
            currentTab.currentFilteredRows = currentTab.currentFilteredRows.map(function(cells) { var n = cells.concat(); n.splice(idx, 1); return n; });
            saveTabToDB(currentTab); // <-- ДОБАВИТЬ ЭТУ СТРОКУ
            generateSearchFields(); renderTableStructure(); renderTableData();
        });
        t.appendChild(closeBtn); t.setAttribute('draggable', 'true'); t.setAttribute('data-index', idx);

        t.addEventListener('dragstart', function(e) { dragSrcIndex = idx; e.dataTransfer.effectAllowed = 'move'; });
        t.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
        t.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
        t.addEventListener('drop', function(e) {
            e.preventDefault(); this.classList.remove('drag-over'); var targetIndex = parseInt(this.getAttribute('data-index'));
            if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                function m(arr, f, to) { var c = arr.concat(), item = c.splice(f, 1); c.splice(to, 0, item); return c; }
                currentTab.tableHeaders = m(currentTab.tableHeaders, dragSrcIndex, targetIndex);
                currentTab.globalRows = currentTab.globalRows.map(function(cells) { return m(cells, dragSrcIndex, targetIndex); });
                currentTab.currentFilteredRows = currentTab.currentFilteredRows.map(function(cells) { return m(cells, dragSrcIndex, targetIndex); });
                saveTabToDB(currentTab); // запоминание
                generateSearchFields(); renderTableStructure(); renderTableData();
            }
        });
        row.appendChild(t); 
    }); 
    th.appendChild(row);
}

function renderTableData() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    var startTime = performance.now();
    var tb = document.getElementById('tableBody'); tb.innerHTML = ''; var gQ = document.getElementById('globalSearchInput').value.trim();
    var pRows = currentTab.currentFilteredRows.slice((currentTab.currentPage - 1) * currentTab.pageSize, currentTab.currentPage * currentTab.pageSize);
    
    function hl(text, searchStr) {
        if (!searchStr) return text; var html = text, words = searchStr.split('%').map(function(w) { return w.trim(); }).filter(function(w) { return w !== ""; });
        words.forEach(function(word) { if (!word) return; var safeStr = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), regex = new RegExp("(" + safeStr + ")", "gi"); html = html.replace(regex, "<span style='font-weight:700;color:var(--accent-color);'>$1</span>"); });
        return html;
    }

    pRows.forEach(function(cells) {
        var tr = document.createElement('tr');
        currentTab.tableHeaders.forEach(function(_, idx) {
            var td = document.createElement('td'); var txt = String(cells[idx] !== undefined ? cells[idx] : ''); var activeQuery = gQ; 
            document.querySelectorAll('#searchContainer input').forEach(function(input) { if (parseInt(input.getAttribute('data-index')) === idx && input.value.trim()) activeQuery = input.value.trim(); });
            td.innerHTML = hl(txt, activeQuery);

            if (txt.trim() !== "") {
                var btn = document.createElement('button'); btn.className = 'copy-btn'; btn.textContent = '📋';
                btn.addEventListener('click', function(e) {
                    e.stopPropagation(); var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; document.body.appendChild(ta); ta.select(); 
                    try { document.execCommand('copy'); btn.textContent = "✓"; btn.classList.add('copied'); setTimeout(function() { btn.textContent = "📋"; btn.classList.remove('copied'); }, 1000); } catch(err){} document.body.removeChild(ta);
                });
                td.appendChild(btn);
            }
            tr.appendChild(td);
        });
        tb.appendChild(tr);
    });

    setupPagination();
    var duration = (performance.now() - startTime).toFixed(1);
    document.getElementById('counter').innerHTML = " <strong>" + currentTab.currentFilteredRows.length + "</strong> |  <strong>" + duration + " мс</strong>";
}

function setupPagination() {
    var currentTab = getActiveTab(); if (!currentTab) return;
    var pc = document.getElementById('pagination'); pc.innerHTML = '';
    var totalPages = Math.ceil(currentTab.currentFilteredRows.length / currentTab.pageSize); if (totalPages <= 1) return;
    var prev = document.createElement('button'); prev.className = 'pagination-btn'; prev.textContent = '« Назад'; prev.disabled = currentTab.currentPage === 1;
    prev.addEventListener('click', function() { currentTab.currentPage--; renderTableData(); }); pc.appendChild(prev);
    var start = Math.max(1, currentTab.currentPage - 2), end = Math.min(totalPages, start + 4); if (end - start < 4) start = Math.max(1, end - 4);
    if (start > 1) { createPageBtn(1, pc); if (start > 2) { var d = document.createElement('span'); d.className = 'pagination-dots'; d.textContent = '...'; pc.appendChild(d); } }
    for (var p = start; p <= end; p++) createPageBtn(p, pc);
    if (end < totalPages) { if (end < totalPages - 1) { var d = document.createElement('span'); d.className = 'pagination-dots'; d.textContent = '...'; pc.appendChild(d); } createPageBtn(totalPages, pc); }
    var next = document.createElement('button'); next.className = 'pagination-btn'; next.textContent = 'Вперед »'; next.disabled = currentTab.currentPage === totalPages;
    next.addEventListener('click', function() { currentTab.currentPage++; renderTableData(); }); pc.appendChild(next);
}

function createPageBtn(p, container) {
    var currentTab = getActiveTab(); if (!currentTab) return;
    var b = document.createElement('button'); b.className = 'pagination-btn'; b.textContent = p; if (p === currentTab.currentPage) b.classList.add('active');
    b.addEventListener('click', function() { currentTab.currentPage = p; renderTableData(); document.querySelector('.table-wrapper').scrollTop = 0; }); container.appendChild(b);
}

document.getElementById('toggleFiltersBtn').addEventListener('click', function() {
    var container = document.getElementById('searchContainer'); container.style.display = (container.style.display === 'none' || !container.style.display) ? 'grid' : 'none';
});

document.getElementById('toggleColumnsBtn').addEventListener('click', function() {
    // Гарантируем, что синяя кнопка поймет, что это редактирование текущей таблицы, а не новый файл
    document.getElementById('applyColumnsBtn').removeAttribute('data-pending-filename');
    
    var panel = document.getElementById('columnChooserPanel'); 
    panel.style.display = (panel.style.display === 'none' || !panel.style.display) ? 'block' : 'none';
});


var isCtrlPressed = false;
window.addEventListener('keydown', function(e) { if (e.key === 'Control') isCtrlPressed = true; });
window.addEventListener('keyup', function(e) { if (e.key === 'Control') { isCtrlPressed = false; removeAllCtrlHighlights(); } });
document.getElementById('dataTable').addEventListener('mousemove', function(e) {
    if (!isCtrlPressed) return; var tr = e.target.closest('tr'); if (tr && tr.parentElement.tagName === 'TBODY') { removeAllCtrlHighlights(); tr.classList.add('ctrl-highlight'); }
});
document.getElementById('dataTable').addEventListener('mouseout', function(e) { var tr = e.target.closest('tr'); if (tr) tr.classList.remove('ctrl-highlight'); });
function removeAllCtrlHighlights() { document.querySelectorAll('#dataTable tbody tr').forEach(function(row) { row.classList.remove('ctrl-highlight'); }); }

document.getElementById('dataTable').addEventListener('click', function(e) {
    if (!isCtrlPressed) return; var tr = e.target.closest('tr'); if (tr && tr.parentElement.tagName === 'TBODY') {
        e.preventDefault(); e.stopPropagation(); var rowData = [];
        tr.querySelectorAll('td').forEach(function(td) { var clone = td.cloneNode(true), btn = clone.querySelector('.copy-btn'); if (btn) clone.removeChild(btn); rowData.push(clone.textContent.trim()); });
        var textarea = document.createElement('textarea'); textarea.value = rowData.join('\n'); textarea.style.position = 'fixed'; document.body.appendChild(textarea); textarea.select();
        try { document.execCommand('copy'); var originalBg = tr.style.backgroundColor; tr.style.transition = 'background-color 0.15s ease'; tr.style.backgroundColor = 'var(--bg-filebox)'; showToast("Строка успешно скопирована"); setTimeout(function() { tr.style.backgroundColor = originalBg; }, 300); } catch (err) {} document.body.removeChild(textarea);
    }
});

function showToast(message) {
    var oldToast = document.querySelector('.toast-notification'); if (oldToast) oldToast.remove();
    var toast = document.createElement('div'); toast.className = 'toast-notification'; toast.innerHTML = '<span style="color:var(--accent-color);">✓</span> ' + message; document.body.appendChild(toast);
    setTimeout(function() { toast.classList.add('show'); }, 10);
    setTimeout(function() { toast.classList.remove('show'); setTimeout(function() { toast.remove(); }, 200); }, 2200);
}




</script>

</body>
